# AppFlowy Cloud — stack auto-hébergée derrière Nginx Proxy Manager
# Dérivé du docker-compose.yml officiel (AppFlowy-IO/AppFlowy-Cloud), adapté :
#   - données persistantes en bind mount sous ${APPFLOWY_DATA_DIR:-}
#   - pas de port publié : NPM joint le nginx interne via le réseau Docker_Net
#   - les autres services restent sur le réseau privé "appflowy" (noms courts
#     postgres/redis/minio/... sans risque de collision sur Docker_Net)
#   - MinIO via le fork pgsty/minio (minio/minio n'est plus publié)
#
# Toutes les valeurs viennent du .env (voir .env.example / scripts/generate-env.sh).

x-common: &common
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  networks:
    - appflowy

services:
  nginx:
    <<: *common
    image: nginx:${NGINX_VERSION:-1.29}
    container_name: AppFlowy-Nginx
    volumes:
      - ${APPFLOWY_DATA_DIR:?err}/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      appflowy:
      Docker_Net:
        aliases:
          - appflowy-nginx
    depends_on:
      appflowy_cloud:
        condition: service_healthy

  minio:
    <<: *common
    image: pgsty/minio:${MINIO_VERSION:-RELEASE.2026-08-04T00-00-00Z}
    container_name: AppFlowy-Minio
    environment:
      - MINIO_BROWSER_REDIRECT_URL=${APPFLOWY_BASE_URL:?err}/minio
      - MINIO_ROOT_USER=${APPFLOWY_S3_ACCESS_KEY:?err}
      - MINIO_ROOT_PASSWORD=${APPFLOWY_S3_SECRET_KEY:?err}
    command: server /data --console-address ":9001"
    volumes:
      - ${APPFLOWY_DATA_DIR:?err}/minio:/data

  postgres:
    <<: *common
    image: pgvector/pgvector:pg16
    container_name: AppFlowy-Postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?err}
      - POSTGRES_DB=${POSTGRES_DB:?err}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?err}
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${POSTGRES_USER:-}", "-d", "${POSTGRES_DB:-}" ]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - ${APPFLOWY_DATA_DIR:?err}/postgres:/var/lib/postgresql/data

  redis:
    <<: *common
    image: redis:7
    container_name: AppFlowy-Redis
    volumes:
      - ${APPFLOWY_DATA_DIR:?err}/redis:/data

  gotrue:
    <<: *common
    image: appflowyinc/gotrue:${GOTRUE_VERSION:-latest}
    container_name: AppFlowy-GoTrue
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: "curl --fail http://127.0.0.1:9999/health || exit 1"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 40s
    environment:
      - GOTRUE_ADMIN_EMAIL=${GOTRUE_ADMIN_EMAIL:?err}
      - GOTRUE_ADMIN_PASSWORD=${GOTRUE_ADMIN_PASSWORD:?err}
      - GOTRUE_DISABLE_SIGNUP=${GOTRUE_DISABLE_SIGNUP:-false}
      - GOTRUE_SITE_URL=appflowy-flutter://
      - GOTRUE_URI_ALLOW_LIST=**
      - GOTRUE_JWT_SECRET=${GOTRUE_JWT_SECRET:?err}
      - GOTRUE_JWT_EXP=${GOTRUE_JWT_EXP:-604800}
      - GOTRUE_JWT_ADMIN_GROUP_NAME=supabase_admin
      - GOTRUE_DB_DRIVER=postgres
      - API_EXTERNAL_URL=${API_EXTERNAL_URL:?err}
      - DATABASE_URL=${GOTRUE_DATABASE_URL:?err}
      - PORT=9999
      - GOTRUE_SMTP_HOST=${GOTRUE_SMTP_HOST:-}
      - GOTRUE_SMTP_PORT=${GOTRUE_SMTP_PORT:-}
      - GOTRUE_SMTP_USER=${GOTRUE_SMTP_USER:-}
      - GOTRUE_SMTP_PASS=${GOTRUE_SMTP_PASS:-}
      - GOTRUE_MAILER_URLPATHS_CONFIRMATION=/gotrue/verify
      - GOTRUE_MAILER_URLPATHS_INVITE=/gotrue/verify
      - GOTRUE_MAILER_URLPATHS_RECOVERY=/gotrue/verify
      - GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE=/gotrue/verify
      - GOTRUE_MAILER_TEMPLATES_MAGIC_LINK=${GOTRUE_MAILER_TEMPLATES_MAGIC_LINK:-}
      - GOTRUE_SMTP_ADMIN_EMAIL=${GOTRUE_SMTP_ADMIN_EMAIL:-}
      - GOTRUE_SMTP_MAX_FREQUENCY=${GOTRUE_SMTP_MAX_FREQUENCY:-1ns}
      - GOTRUE_RATE_LIMIT_EMAIL_SENT=${GOTRUE_RATE_LIMIT_EMAIL_SENT:-100}
      - GOTRUE_MAILER_AUTOCONFIRM=${GOTRUE_MAILER_AUTOCONFIRM:-true}
      - GOTRUE_EXTERNAL_GOOGLE_ENABLED=${GOTRUE_EXTERNAL_GOOGLE_ENABLED:-false}
      - GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID=${GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID:-}
      - GOTRUE_EXTERNAL_GOOGLE_SECRET=${GOTRUE_EXTERNAL_GOOGLE_SECRET:-}
      - GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI=${API_EXTERNAL_URL:-}/callback
      - GOTRUE_EXTERNAL_GITHUB_ENABLED=${GOTRUE_EXTERNAL_GITHUB_ENABLED:-false}
      - GOTRUE_EXTERNAL_GITHUB_CLIENT_ID=${GOTRUE_EXTERNAL_GITHUB_CLIENT_ID:-}
      - GOTRUE_EXTERNAL_GITHUB_SECRET=${GOTRUE_EXTERNAL_GITHUB_SECRET:-}
      - GOTRUE_EXTERNAL_GITHUB_REDIRECT_URI=${API_EXTERNAL_URL:-}/callback
      - GOTRUE_EXTERNAL_DISCORD_ENABLED=${GOTRUE_EXTERNAL_DISCORD_ENABLED:-false}
      - GOTRUE_EXTERNAL_DISCORD_CLIENT_ID=${GOTRUE_EXTERNAL_DISCORD_CLIENT_ID:-}
      - GOTRUE_EXTERNAL_DISCORD_SECRET=${GOTRUE_EXTERNAL_DISCORD_SECRET:-}
      - GOTRUE_EXTERNAL_DISCORD_REDIRECT_URI=${API_EXTERNAL_URL:-}/callback
      - GOTRUE_SAML_ENABLED=${GOTRUE_SAML_ENABLED:-false}
      - GOTRUE_SAML_PRIVATE_KEY=${GOTRUE_SAML_PRIVATE_KEY:-}

  appflowy_cloud:
    <<: *common
    image: appflowyinc/appflowy_cloud:${APPFLOWY_CLOUD_VERSION:-latest}
    container_name: AppFlowy-Cloud
    depends_on:
      gotrue:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    healthcheck:
      test: "curl --fail http://127.0.0.1:8000/api/health || exit 1"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - APPFLOWY_ENVIRONMENT=production
      - APPFLOWY_DATABASE_URL=${APPFLOWY_DATABASE_URL:?err}
      - APPFLOWY_REDIS_URI=${APPFLOWY_REDIS_URI:?err}
      - APPFLOWY_GOTRUE_JWT_SECRET=${GOTRUE_JWT_SECRET:?err}
      - APPFLOWY_GOTRUE_BASE_URL=${APPFLOWY_GOTRUE_BASE_URL:-http://gotrue:9999}
      - APPFLOWY_S3_CREATE_BUCKET=${APPFLOWY_S3_CREATE_BUCKET:-true}
      - APPFLOWY_S3_USE_MINIO=${APPFLOWY_S3_USE_MINIO:-true}
      - APPFLOWY_S3_MINIO_URL=${APPFLOWY_S3_MINIO_URL:-http://minio:9000}
      - APPFLOWY_S3_ACCESS_KEY=${APPFLOWY_S3_ACCESS_KEY:?err}
      - APPFLOWY_S3_SECRET_KEY=${APPFLOWY_S3_SECRET_KEY:?err}
      - APPFLOWY_S3_BUCKET=${APPFLOWY_S3_BUCKET:-appflowy}
      - APPFLOWY_S3_REGION=${APPFLOWY_S3_REGION:-us-east-1}
      - APPFLOWY_S3_PRESIGNED_URL_ENDPOINT=${APPFLOWY_S3_PRESIGNED_URL_ENDPOINT:?err}
      - APPFLOWY_MAILER_SMTP_HOST=${APPFLOWY_MAILER_SMTP_HOST:-}
      - APPFLOWY_MAILER_SMTP_PORT=${APPFLOWY_MAILER_SMTP_PORT:-}
      - APPFLOWY_MAILER_SMTP_USERNAME=${APPFLOWY_MAILER_SMTP_USERNAME:-}
      - APPFLOWY_MAILER_SMTP_EMAIL=${APPFLOWY_MAILER_SMTP_EMAIL:-}
      - APPFLOWY_MAILER_SMTP_PASSWORD=${APPFLOWY_MAILER_SMTP_PASSWORD:-}
      - APPFLOWY_MAILER_SMTP_TLS_KIND=${APPFLOWY_MAILER_SMTP_TLS_KIND:-wrapper}
      - APPFLOWY_ACCESS_CONTROL=${APPFLOWY_ACCESS_CONTROL:-true}
      - APPFLOWY_DATABASE_MAX_CONNECTIONS=${APPFLOWY_DATABASE_MAX_CONNECTIONS:-40}
      - AI_SERVER_HOST=${AI_SERVER_HOST:-ai}
      - AI_SERVER_PORT=${AI_SERVER_PORT:-5001}
      - AI_OPENAI_API_KEY=${AI_OPENAI_API_KEY:-}
      - APPFLOWY_WEB_URL=${APPFLOWY_WEB_URL:?err}
      - APPFLOWY_BASE_URL=${APPFLOWY_BASE_URL:?err}
      - ASSEMBLYAI_API_KEY=${ASSEMBLYAI_API_KEY:-}
      - ASSEMBLYAI_API_BASE=${ASSEMBLYAI_API_BASE:-https://api.assemblyai.com/v2}
      - ASSEMBLYAI_STREAMING_API_BASE=${ASSEMBLYAI_STREAMING_API_BASE:-https://streaming.assemblyai.com/v3}
      - APPFLOWY_SEARCH_SERVICE_URL=http://appflowy_search:4002
      - APPFLOWY_SEARCH_REQUEST_TIMEOUT_SECS=10
      - AI_ENABLED=${AI_ENABLED:-true}
      - SIGNUP_WHITELIST_ENABLED=${SIGNUP_WHITELIST_ENABLED:-false}
      - GUEST_INVITES_REQUIRE_ADMIN_APPROVAL=${GUEST_INVITES_REQUIRE_ADMIN_APPROVAL:-false}

  admin_frontend:
    <<: *common
    image: appflowyinc/admin_frontend:${APPFLOWY_ADMIN_FRONTEND_VERSION:-latest}
    container_name: AppFlowy-Admin
    environment:
      - APPFLOWY_GOTRUE_BASE_URL=http://gotrue:9999
      - APPFLOWY_BASE_URL=http://appflowy_cloud:8000
    depends_on:
      gotrue:
        condition: service_healthy
      appflowy_cloud:
        condition: service_healthy

  ai:
    <<: *common
    image: appflowyinc/appflowy_ai:${APPFLOWY_AI_VERSION:-latest}
    container_name: AppFlowy-AI
    environment:
      - AI_SERVER_PORT=${AI_SERVER_PORT:-5001}
      - OPENAI_API_KEY=${AI_OPENAI_API_KEY:-}
      - DEFAULT_AI_MODEL=${AI_DEFAULT_MODEL:-gpt-4.1-mini}
      - DEFAULT_AI_COMPLETION_MODEL=${AI_DEFAULT_MODEL:-gpt-4.1-mini}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
      - AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION:-}
      - APPFLOWY_S3_ACCESS_KEY=${APPFLOWY_S3_ACCESS_KEY:?err}
      - APPFLOWY_S3_SECRET_KEY=${APPFLOWY_S3_SECRET_KEY:?err}
      - APPFLOWY_S3_BUCKET=${APPFLOWY_S3_BUCKET:-appflowy}
      - APPFLOWY_S3_REGION=${APPFLOWY_S3_REGION:-us-east-1}
      - AI_DATABASE_URL=${APPFLOWY_DATABASE_URL:?err}
      - AI_REDIS_URL=${APPFLOWY_REDIS_URI:?err}
      - AI_USE_MINIO=${APPFLOWY_S3_USE_MINIO:-true}
      - AI_MINIO_URL=${APPFLOWY_S3_MINIO_URL:-http://minio:9000}
      - AI_APPFLOWY_HOST=${APPFLOWY_BASE_URL:?err}
      - APPFLOWY_GOTRUE_JWT_SECRET=${GOTRUE_JWT_SECRET:?err}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5001/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      appflowy_cloud:
        condition: service_healthy

  appflowy_worker:
    <<: *common
    image: appflowyinc/appflowy_worker:${APPFLOWY_WORKER_VERSION:-latest}
    container_name: AppFlowy-Worker
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - APPFLOWY_ENVIRONMENT=production
      - APPFLOWY_WORKER_REDIS_URL=${APPFLOWY_REDIS_URI:?err}
      - APPFLOWY_WORKER_ENVIRONMENT=production
      - APPFLOWY_WORKER_DATABASE_URL=${APPFLOWY_DATABASE_URL:?err}
      - APPFLOWY_WORKER_DATABASE_NAME=${POSTGRES_DB:?err}
      - APPFLOWY_WORKER_IMPORT_TICK_INTERVAL=30
      - APPFLOWY_S3_USE_MINIO=${APPFLOWY_S3_USE_MINIO:-true}
      - APPFLOWY_S3_MINIO_URL=${APPFLOWY_S3_MINIO_URL:-http://minio:9000}
      - APPFLOWY_S3_ACCESS_KEY=${APPFLOWY_S3_ACCESS_KEY:?err}
      - APPFLOWY_S3_SECRET_KEY=${APPFLOWY_S3_SECRET_KEY:?err}
      - APPFLOWY_S3_BUCKET=${APPFLOWY_S3_BUCKET:-appflowy}
      - APPFLOWY_S3_REGION=${APPFLOWY_S3_REGION:-us-east-1}
      - APPFLOWY_MAILER_SMTP_HOST=${APPFLOWY_MAILER_SMTP_HOST:-}
      - APPFLOWY_MAILER_SMTP_PORT=${APPFLOWY_MAILER_SMTP_PORT:-}
      - APPFLOWY_MAILER_SMTP_USERNAME=${APPFLOWY_MAILER_SMTP_USERNAME:-}
      - APPFLOWY_MAILER_SMTP_EMAIL=${APPFLOWY_MAILER_SMTP_EMAIL:-}
      - APPFLOWY_MAILER_SMTP_PASSWORD=${APPFLOWY_MAILER_SMTP_PASSWORD:-}
      - APPFLOWY_MAILER_SMTP_TLS_KIND=${APPFLOWY_MAILER_SMTP_TLS_KIND:-wrapper}
    depends_on:
      postgres:
        condition: service_healthy
      appflowy_cloud:
        condition: service_healthy

  appflowy_search:
    <<: *common
    image: appflowyinc/appflowy_search:${APPFLOWY_SEARCH_VERSION:-latest}
    container_name: AppFlowy-Search
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - APPFLOWY_SEARCH_HOST=[::]
      - APPFLOWY_SEARCH_PORT=4002
      - APPFLOWY_SEARCH_DATABASE_URL=${APPFLOWY_DATABASE_URL:?err}
      - APPFLOWY_SEARCH_REDIS_URL=${APPFLOWY_REDIS_URI:?err}
      - AI_OPENAI_API_KEY=${AI_OPENAI_API_KEY:-}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
      - AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION:-}
      - APPFLOWY_S3_USE_MINIO=${APPFLOWY_S3_USE_MINIO:-true}
      - APPFLOWY_S3_MINIO_URL=${APPFLOWY_S3_MINIO_URL:-http://minio:9000}
      - APPFLOWY_S3_ACCESS_KEY=${APPFLOWY_S3_ACCESS_KEY:?err}
      - APPFLOWY_S3_SECRET_KEY=${APPFLOWY_S3_SECRET_KEY:?err}
      - APPFLOWY_S3_BUCKET=${APPFLOWY_S3_BUCKET:-appflowy}
      - APPFLOWY_S3_REGION=${APPFLOWY_S3_REGION:-us-east-1}
      - APPFLOWY_BACKGROUND_INDEXER_ENABLED=true
      - APPFLOWY_INDEXER_DATABASE_ENABLED=false
      - APPFLOWY_KEYWORD_SEARCH_ENABLED=true
      - APPFLOWY_KEYWORD_WORKER_ENABLED=true
      - APPFLOWY_KEYWORD_INDEX_MAP_SIZE_BYTES=2147483648
      - APPFLOWY_KEYWORD_INDEX_DIR=/var/lib/appflowy/keyword_index
      - APPFLOWY_GOTRUE_JWT_SECRET=${GOTRUE_JWT_SECRET:?err}
    volumes:
      # Volume nommé (et non bind mount) : l'image ne tourne pas forcément en root,
      # un volume nommé hérite des bons droits. L'index est reconstructible.
      - keyword_index_data:/var/lib/appflowy/keyword_index
    healthcheck:
      # L'image ne contient ni curl ni wget : check HTTP via /dev/tcp de bash.
      test:
        - CMD
        - bash
        - -ec
        - |
          exec 3<>/dev/tcp/127.0.0.1/4002
          printf 'GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          read -r _ status _ <&3
          [ "$$status" = 200 ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy

  appflowy_web:
    <<: *common
    image: appflowyinc/appflowy_web:${APPFLOWY_WEB_VERSION:-latest}
    container_name: AppFlowy-Web
    depends_on:
      appflowy_cloud:
        condition: service_healthy
    environment:
      - APPFLOWY_BASE_URL=${APPFLOWY_BASE_URL:?err}
      - APPFLOWY_GOTRUE_BASE_URL=${API_EXTERNAL_URL:?err}
      - APPFLOWY_WS_BASE_URL=${APPFLOWY_WEBSOCKET_BASE_URL:?err}

networks:
  appflowy:
    name: appflowy
  Docker_Net:
    external: true

volumes:
  keyword_index_data:
